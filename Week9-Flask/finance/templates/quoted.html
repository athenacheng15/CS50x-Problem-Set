{% extends "layout.html" %}

{% block title %}
   Quoted
{% endblock %}

{% block main %}
<h2>Quoted</h2>
    <table>
        <tr>
            <th>Symbol</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>{{stock.symbol}}</td>
            <td>{{stock.name}}</td>
            <p>Price: ${{ "%.2f" | format(stock.price) }}</p>
        </tr>
    </table>
{% endblock %}
